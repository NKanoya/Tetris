<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="style/style.css" />
    <link rel="stylesheet" href="style/tetris.css" />
    <link rel="stylesheet" href="style/score_board.css" />
</head>
<body>
<div class="base-container">
    <div class="bordered-container content-container matrix-container">
        <div id="tetris-matrix">
        </div>
    </div>
    <div class="bottom-container">
        <div id="info">
            <div id="score-title">Score</div>
            <div class="bordered-container score-container" id="score-box">
                <div id="score">0 0 0 0</div>
            </div>
        </div>
    </div>
</div>


<script src="js/matrix.js"></script>
<!--<script src="js/Tetris.js" type="module"></script>-->
<script src="../../../cmake-build-debug/Tetris.js" type="module"></script>
<script type="module">
    import getModule from '../../../cmake-build-debug/Tetris.js';

    async function runWasm() {
        const wasmModule = await getModule();

        if (wasmModule && wasmModule.ccall) {
            wasmModule.ccall('JS_process_loop', null, [], []);
        } else {
            console.error("Fail to Load Module!");
        }
    }

    runWasm();
</script>
</body>
</html>
